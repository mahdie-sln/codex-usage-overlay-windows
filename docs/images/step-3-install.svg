<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Run the PowerShell installer</title>
  <desc id="desc">Illustration of the install command and the I AGREE consent prompt.</desc>
  <rect width="1100" height="620" rx="24" fill="#0b1220"/>
  <rect x="42" y="38" width="1016" height="530" rx="16" fill="#080b11" stroke="#45546a" stroke-width="2"/>
  <rect x="42" y="38" width="1016" height="48" rx="16" fill="#171d27"/>
  <text x="76" y="69" fill="#e5edf7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Windows PowerShell</text>
  <g font-family="Consolas, monospace" font-size="17">
    <text x="76" y="124" fill="#70e7c1">PS C:\Downloads\CodexUsageOverlay&gt;</text>
    <text x="76" y="156" fill="#e5edf7">powershell -NoProfile -ExecutionPolicy Bypass -File .\Install.ps1</text>
    <text x="76" y="212" fill="#ffd166" font-weight="700">IMPORTANT PRIVACY AND ACCOUNT NOTICE</text>
    <text x="76" y="247" fill="#c5cfdd">This overlay runs "codex-auth list --api" every 60 seconds by default.</text>
    <text x="76" y="277" fill="#c5cfdd">The third-party tool sends the locally stored access token only to OpenAI</text>
    <text x="76" y="307" fill="#c5cfdd">usage/account endpoints. The overlay never prints, copies, or logs it.</text>
    <text x="76" y="355" fill="#e5edf7">Type I AGREE to enable API-backed usage refresh:</text>
    <rect x="585" y="330" width="142" height="38" rx="6" fill="#132c25" stroke="#2dd4a8" stroke-width="2"/>
    <text x="605" y="356" fill="#78f0cf" font-weight="700">I AGREE</text>
    <text x="76" y="416" fill="#70e7c1" font-weight="700">Codex Multi-Account Usage Overlay installed.</text>
    <text x="76" y="448" fill="#c5cfdd">Location: %LOCALAPPDATA%\Programs\CodexUsageOverlay</text>
    <text x="76" y="480" fill="#c5cfdd">Autostart: enabled when Codex opens</text>
  </g>
  <rect x="739" y="376" width="268" height="112" rx="14" fill="#10251f" stroke="#2dd4a8" stroke-width="2"/>
  <text x="873" y="409" text-anchor="middle" fill="#c8fff0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">3. Review before accepting</text>
  <text x="873" y="437" text-anchor="middle" fill="#8ed9c5" font-family="Segoe UI, Arial, sans-serif" font-size="14">Type I AGREE only if you accept</text>
  <text x="873" y="460" text-anchor="middle" fill="#8ed9c5" font-family="Segoe UI, Arial, sans-serif" font-size="14">the documented upstream API risk.</text>
  <path d="M736 408 C705 390 681 379 665 367" fill="none" stroke="#2dd4a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M670 378 l-7-12 l13 2" fill="none" stroke="#2dd4a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="598" text-anchor="middle" fill="#90a0b6" font-family="Segoe UI, Arial, sans-serif" font-size="14">No administrator window should appear. The installation is per-user and reversible.</text>
</svg>
