<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Extract the release and open PowerShell in the folder</title>
  <desc id="desc">Illustration of File Explorer with powershell typed in the address bar.</desc>
  <rect width="1100" height="560" rx="24" fill="#0b1220"/>
  <rect x="42" y="36" width="1016" height="480" rx="16" fill="#111827" stroke="#40506a" stroke-width="2"/>
  <rect x="42" y="36" width="1016" height="54" rx="16" fill="#171f2c"/>
  <text x="74" y="70" fill="#e7eef8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">File Explorer</text>
  <rect x="70" y="108" width="900" height="46" rx="8" fill="#0b1220" stroke="#2878d4" stroke-width="3"/>
  <text x="94" y="138" fill="#f0f6fc" font-family="Consolas, monospace" font-size="19">powershell</text>
  <rect x="985" y="108" width="47" height="46" rx="8" fill="#2878d4"/>
  <path d="M1000 131 h17 m-6-6 l6 6 l-6 6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="70" y="182" width="210" height="300" rx="8" fill="#172033"/>
  <text x="92" y="219" fill="#dce7f5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Quick access</text>
  <text x="92" y="255" fill="#a9b7ca" font-family="Segoe UI, Arial, sans-serif" font-size="15">Downloads</text>
  <text x="92" y="291" fill="#a9b7ca" font-family="Segoe UI, Arial, sans-serif" font-size="15">Desktop</text>
  <text x="92" y="327" fill="#a9b7ca" font-family="Segoe UI, Arial, sans-serif" font-size="15">Documents</text>
  <text x="318" y="211" fill="#dce7f5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Name</text>
  <line x1="300" y1="228" x2="1028" y2="228" stroke="#2f3f58"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e7eef8">
    <rect x="316" y="250" width="26" height="32" rx="3" fill="#2775c9"/>
    <text x="360" y="272">Install.ps1</text>
    <rect x="316" y="300" width="26" height="32" rx="3" fill="#2775c9"/>
    <text x="360" y="322">src</text>
    <rect x="316" y="350" width="26" height="32" rx="3" fill="#6c7b90"/>
    <text x="360" y="372">README.md</text>
    <rect x="316" y="400" width="26" height="32" rx="3" fill="#6c7b90"/>
    <text x="360" y="422">docs</text>
  </g>
  <path d="M755 181 C840 181 858 157 858 145" fill="none" stroke="#22a983" stroke-width="4" stroke-linecap="round"/>
  <path d="M848 152 l10-10 l10 10" fill="none" stroke="#22a983" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="194" width="285" height="78" rx="14" fill="#10251f" stroke="#2dd4a8" stroke-width="2"/>
  <text x="862" y="225" text-anchor="middle" fill="#78f0cf" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">2. Type powershell here</text>
  <text x="862" y="249" text-anchor="middle" fill="#8ed8c2" font-family="Segoe UI, Arial, sans-serif" font-size="14">Press Enter to open it in this folder</text>
