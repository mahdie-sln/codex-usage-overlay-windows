name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate package
        shell: powershell
        run: .\tests\Test-Package.ps1
      - name: Test usage parser
        shell: powershell
        run: .\tests\Test-UsageParser.ps1
      - name: Test account status
        shell: powershell
        run: .\tests\Test-AccountStatus.ps1
      - name: Test user-level install and uninstall
        shell: powershell
        run: .\tests\Test-InstallCycle.ps1
      - name: Build release archive
        shell: powershell
        run: .\tools\Build-Release.ps1
      - name: Publish release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'codex-usage-overlay-release'
          }
          try {
            Invoke-RestMethod -Uri $releaseUri -Headers $headers | Out-Null
            $releaseExists = $true
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $releaseExists = $false
          }
          if ($releaseExists) {
            gh release edit $tag `
              --title "Codex Usage Overlay & Multi-Account Manager for Windows $tag" `
              --notes-file .\docs\RELEASE_NOTES.md `
              --latest
          } else {
            gh release create $tag `
              --title "Codex Usage Overlay & Multi-Account Manager for Windows $tag" `
              --notes-file .\docs\RELEASE_NOTES.md `
              --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the release.' }
          gh release upload $tag `
            .\dist\CodexUsageOverlay-Windows.zip `
            .\dist\CodexUsageOverlay-Windows.zip.sha256 `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release assets.' }
