name: Feature request
description: Suggest a focused improvement to the Windows overlay.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: dropdown
    id: account_access
    attributes:
      label: Does this require additional account or network access?
      options:
        - "No"
        - "Unsure"
        - "Yes"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include credentials, raw authentication data, or unredacted account addresses.
          required: true
